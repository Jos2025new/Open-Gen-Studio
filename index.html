<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Before first paint: UI preference only (never the persisted settings or the store). Sistema follows the OS; no value or an error gives atlas + lima.
      (function () {
        var b = 'atlas', a = 'lima', r = document.documentElement;
        try {
          var sb = localStorage.getItem('ogs-base'), sa = localStorage.getItem('ogs-accent');
          if (sa === 'lima' || sa === 'azul' || sa === 'violeta' || sa === 'rosa' || sa === 'agua' || sa === 'aurora') a = sa;
          if (sb === 'atlas' || sb === 'grafito' || sb === 'claro' || sb === 'blanco' || sb === 'original') b = sb;
          else if (sb === 'sistema') b = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'atlas';
        } catch (e) {}
        r.setAttribute('data-base', b);
        r.setAttribute('data-accent', a);
      })();
    </script>
    <title>Open Gen Studio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
