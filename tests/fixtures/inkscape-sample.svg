<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:xlink="http://www.w3.org/1999/xlink" width="210mm" height="297mm" viewBox="0 0 210 297" version="1.1" id="svg1">
  <sodipodi:namedview id="namedview1" inkscape:current-layer="layer1"/>
  <style>.cls-1{fill:#336699;stroke:#000;stroke-width:0.5}#special{fill:#ff00ff}</style>
  <defs id="defs1">
    <linearGradient id="grad1"><stop offset="0" stop-color="#ff0000"/><stop offset="1" stop-color="#0000ff"/></linearGradient>
    <filter id="blur1" inkscape:label="Blur" style="color-interpolation-filters:sRGB"><feGaussianBlur stdDeviation="2.5" id="feGaussianBlur1" inkscape:collect="always"/></filter>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="Fondo" id="layer1">
    <rect id="r1" x="10" y="10" width="50" height="30" rx="5" ry="3" style="fill:#ff0000;fill-opacity:0.5;stroke:#00ff00;stroke-width:2;stroke-opacity:0.25;stroke-linejoin:bevel;stroke-dasharray:4,2"/>
    <path id="p1" d="m 10,100 h 20 v 20 a 10,10 0 0 1 -10,10 l -10,0 z" class="cls-1"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Formas" id="layer2" style="opacity:0.5">
    <ellipse cx="100" cy="50" rx="20" ry="10" filter="url(#blur1)" style="fill:#0000ff"/>
    <rect id="gradrect" x="20" y="150" width="40" height="20" fill="url(#grad1)"/>
    <text x="20" y="200" style="font-size:12px;fill:#000000">Hola</text>
    <g id="grupo1" inkscape:label="Grupo uno"><circle id="special" cx="150" cy="150" r="10"/></g>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Oculta" id="layer3" style="display:none">
    <rect id="hid" x="1" y="1" width="5" height="5"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Bloqueada" id="layer4" sodipodi:insensitive="true">
    <rect id="lock" x="2" y="2" width="6" height="6" fill="#123456"/>
  </g>
</svg>
