<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 200">
  <defs>
    <style>
      .cls-1, .cls-2 {
        fill: #f15a24;
      }

      .cls-3 {
        fill: none;
        stroke: #1b1464;
        stroke-miterlimit: 10;
        stroke-width: 4px;
      }

      .cls-4 {
        fill: url(#linear-gradient);
      }

      .cls-5 {
        opacity: .5;
      }

      .cls-6 {
        fill: #29abe2;
      }

      .cls-7 {
