      <rect class="cls-6" width="300" height="200"/>
    </g>
    <g id="Art_work" data-name="Art work">
      <g id="Logo">
        <rect class="cls-1" x="20" y="20" width="60" height="60"/>
        <circle class="cls-3" cx="50" cy="50" r="20"/>
      </g>
      <g class="cls-5">
        <rect class="cls-1" x="120" y="20" width="60" height="60"/>
        <polygon class="cls-6" points="150 30 170 70 130 70 150 30"/>
      </g>
      <rect class="cls-4" x="20" y="130" width="100" height="40"/>
      <path class="cls-2" d="M200,40c20,0,40,20,40,40s-20,40-40,40Z"/>
